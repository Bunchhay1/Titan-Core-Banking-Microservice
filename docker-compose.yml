version: '3.8'

# =============================================================================
# Titan Banking Platform — Master Local Docker Compose Orchestration
# =============================================================================
# Services:
#   postgres                    → 5432   (titandb, notificationdb, promotiondb)
#   redis                       → 6379   (session, locks, caches)
#   kafka (KRaft single broker) → 9092   (event streaming engine)
#   titan-ai-service            → 50051 / 8085 (gRPC + HTTP risk scoring)
#   titan-core-banking          → 8080   (Core Banking transactions/accounts)
#   titan-notifications-service → 8084   (Event-driven alerts, SMS, push)
#   titan-promotions-service    → 8083   (Event-driven rewards, cashback)
#   titan-gateway-go            → 8088   (Unified API Gateway for iOS / Web)
# =============================================================================

services:

  # ── PostgreSQL with PostGIS ────────────────────────────────────────────────
  postgres:
    image: postgis/postgis:15-3.4-alpine
    container_name: titan-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: titandb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db/01-create-databases.sql:/docker-entrypoint-initdb.d/01-create-databases.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d titandb"]
      interval: 5s
      timeout: 5s
      start_period: 15s
      retries: 10
    networks:
      - titan-net

  # ── Redis In-Memory Cache & Distributed Lock ───────────────────────────────
  redis:
    image: redis:7.2-alpine
    container_name: titan-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - titan-net

  # ── Kafka Broker (KRaft Mode - No Zookeeper needed) ────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: titan-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://localhost:9092,INTERNAL://kafka:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_MIN_INSYNC_REPLICAS: 1
      KAFKA_CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg=="
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg=="
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      start_period: 25s
      retries: 10
    networks:
      - titan-net

  # ── Kafka Topic Initializer ────────────────────────────────────────────────
  kafka-init:
    image: confluentinc/cp-kafka:7.6.0
    container_name: titan-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: [ "/bin/sh", "-c" ]
    command: |
      "
        echo 'Creating Kafka topics...'
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic banking.transactions.completed --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic banking.accounts.created --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic banking.accounts.updated --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic banking.transactions.dlq --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic banking.transactions.poison --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic titan.banking.transactions --partitions 3 --replication-factor 1
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic titan.banking.audit --partitions 3 --replication-factor 1
        echo 'Kafka topics initialized.'
      "
    networks:
      - titan-net

  # ── AI Risk Engine (Python gRPC + HTTP) ────────────────────────────────────
  titan-ai-service:
    build:
      context: ./titan-ai-service
      dockerfile: Dockerfile
    container_name: titan-ai-service
    restart: unless-stopped
    ports:
      - "8085:8085"
      - "50051:50051"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PYTHONUNBUFFERED: 1
      PORT: 8085
      GRPC_PORT: 50051
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: titan_systemdb
      DB_USER: postgres
      DB_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8085/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    networks:
      - titan-net

  # ── Core Banking Microservice (Java Spring Boot 3) ─────────────────────────
  titan-core-banking:
    build:
      context: ./Titan-core-bank
      dockerfile: Dockerfile
    container_name: titan-core-banking
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      titan-ai-service:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: titandb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_ENABLED: "true"
      AI_HOST: titan-ai-service
      AI_PORT: 50051
      NOTIFICATION_SERVICE_URL: http://titan-notifications-service:8084
      JWT_SECRET: "5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 5
    networks:
      - titan-net

  # ── Notifications Microservice (Java Spring Boot 3) ────────────────────────
  titan-notifications-service:
    build:
      context: ./Titan-notifications-service
      dockerfile: Dockerfile
    container_name: titan-notifications-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: notificationdb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      SPRING_DATASOURCE_URL: "jdbc:postgresql://postgres:5432/notificationdb"
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_ENABLED: "true"
      SPRING_KAFKA_BOOTSTRAPSERVERS: kafka:29092
      VAULT_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8084/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5
    networks:
      - titan-net

  # ── Promotions Microservice (Java Spring Boot 3) ───────────────────────────
  titan-promotions-service:
    build:
      context: ./Titan-promotions-service
      dockerfile: Dockerfile
    container_name: titan-promotions-service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      DATABASE_URL: "jdbc:postgresql://postgres:5432/promotiondb"
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAPSERVERS: kafka:29092
      CORE_BANKING_GRPC_HOST: titan-core-banking
      CORE_BANKING_GRPC_PORT: 9090
      AI_SERVICE_HOST: titan-ai-service
      AI_SERVICE_PORT: 50051
      AI_SERVICE_URL: http://titan-ai-service:8085
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8083/actuator/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 45s
      retries: 5
    networks:
      - titan-net

  # ── API Gateway (Golang High-Performance Proxy) ────────────────────────────
  titan-gateway-go:
    build:
      context: ./Titan-gateway-go
      dockerfile: Dockerfile
    container_name: titan-gateway-go
    restart: unless-stopped
    depends_on:
      titan-core-banking:
        condition: service_healthy
      titan-notifications-service:
        condition: service_healthy
      titan-promotions-service:
        condition: service_healthy
      titan-ai-service:
        condition: service_healthy
    ports:
      - "8088:8088"
    environment:
      JWT_SECRET: "5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8088/health || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - titan-net

networks:
  titan-net:
    driver: bridge

volumes:
  postgres_data:
